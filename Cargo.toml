[package]
name = "veros"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader = { version = "0.9.23", features = ["map_physical_memory"] }
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.14.2"
pic8259 = "0.10.1"
pc-keyboard = "0.5.0"
linked_list_allocator = "0.9.0"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
uart_16550 = "0.2.0"

[patch.crates-io]
x86_64 = { path = "vendor/x86_64-patched" }

[package.metadata.bootimage]
run-args = ["-serial", "tcp:127.0.0.1:4444,server,nowait"]
test-args = ["-serial", "tcp:127.0.0.1:4444,server,nowait"]
